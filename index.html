<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>SRMS</title>
</head>
<body>
    <div class="input-container">

        <h1>Student Result Management System</h1>

        <form>
            <p><b>Student details</b></p>
            <div class="student-details">
                <label>Student ID:</label>
                <input type="text" id="Id" placeholder="e.g. 25000XXXXX">
                
                <label>Student username:</label>
                <input type="text" id="username" placeholder="e.g. aryan reddy">
            </div>

            <p><b>Student marks</b></p>
            <div class="student-marks">
                <label>OS marks:</label>
                <input type="text" id="os-marks" placeholder="0-50">

                <label>OOPs marks:</label>
                <input type="text" id="oops-marks" placeholder="0-50">
                
                <label>IOT marks:</label>
                <input type="text" id="iot-marks" placeholder="0-50">
                
                <label>MATHS marks:</label>
                <input type="text" id="maths-marks" placeholder="0-50">
                
                <label>FEDF marks:</label>
                <input type="text" id="fedf-marks" placeholder="0-50">
            </div>
        </form>

        <br>
        <button id="submitBtn" type="button">Submit</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
