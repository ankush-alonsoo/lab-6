<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SRMS - Display</title>
</head>
<body>
    <div class="display-container">
        
        <h1>Student Result Summary</h1>

        <table>
            <tr>
                <th>Metrics</th>
                <th>Outcomes</th>
            </tr>
            <tr>
                <td>Total marks:</td>
                <td id="total-marks"></td>
            </tr>
            <tr>
                <td>Percentage:</td>
                <td id="percentage"></td>
            </tr>
            <tr>
                <td>Grade:</td>
                <td id="grade"></td>
            </tr>
            <tr>
                <td>Result:</td>
                <td id="result"></td>
            </tr>
        </table>

        <br>
        <button id="clearBtn">Clear</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
